apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-security-agent
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dependency-security-agent
  template:
    metadata:
      labels:
        app: dependency-security-agent
    spec:
      containers:
        - name: agent
          image: your-registry/dependency-security-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: KAFKA_INPUT_TOPIC
              value: "security.dependency.events"
            - name: KAFKA_INCIDENT_TOPIC
              value: "security.incidents"
            - name: KAFKA_GROUP_ID
              value: "dependency-security-agent"
