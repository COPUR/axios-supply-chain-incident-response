name: guardrail-matrix

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Guardrail mode"
        required: true
        default: "denylist-only"
        type: choice
        options:
          - "denylist-only"
          - "full"
      scan_roots:
        description: "Space-separated root paths to scan"
        required: true
        default: "."
      exit_policy:
        description: "Pipeline fail policy"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "block-only"

jobs:
  guardrail-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OBSERVABILITY_EVENTS_FILE: .observability/events.ndjson
      OBSERVABILITY_FORMAT: json
      OBSERVABILITY_LEVEL: info
      OBSERVABILITY_SELF_HEAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Initialize observability artifact path
        run: |
          set -euo pipefail
          mkdir -p .observability
          rm -f "${OBSERVABILITY_EVENTS_FILE}"

      - name: Restore guardrail metadata cache
        uses: actions/cache@v4
        with:
          path: .guardrail-cache
          key: guardrail-npm-metadata-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', 'policies/guardrail-policy.json') }}
          restore-keys: |
            guardrail-npm-metadata-${{ runner.os }}-

      - name: Run lockfile matrix guardrail
        env:
          MODE: ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.mode || 'denylist-only' }}
          SCAN_ROOTS: ${{ github.event.inputs.scan_roots || '.' }}
          EXIT_POLICY: ${{ github.event.inputs.exit_policy || 'all' }}
        run: |
          set -euo pipefail
          args=(
            --roots ${SCAN_ROOTS}
            --output-dir guardrail-ci-output
            --policy-file policies/guardrail-policy.json
            --guardrail-script scripts/guardrail.js
            --cache-file .guardrail-cache/npm-metadata.json
            --http-timeout-seconds 10
            --runner-timeout-seconds 240
            --exit-on "${EXIT_POLICY}"
            --age-scope all
            --exclude-substring "/.runtime/"
            --exclude-substring "/.npm-cache/"
          )

          if [ "${MODE}" = "denylist-only" ]; then
            args+=(--denylist-only)
          else
            # Full mode is kept practical by evaluating age policy on direct dependencies.
            args+=(--age-scope direct)
          fi

          node scripts/run-guardrail-matrix.js "${args[@]}"

      - name: Enforce observability telemetry gate
        if: always()
        run: |
          npm run observability:verify -- \
            --events-file "${OBSERVABILITY_EVENTS_FILE}" \
            --expected-tools guardrail_matrix \
            --min-events 2

      - name: Generate observability insights
        if: always()
        run: |
          npm run observability:insights -- \
            --events-file "${OBSERVABILITY_EVENTS_FILE}" \
            --output .observability/insights.md

      - name: Upload guardrail matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-matrix-output
          path: guardrail-ci-output

      - name: Upload observability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-guardrail-matrix
          path: .observability
