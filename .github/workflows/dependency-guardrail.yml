name: dependency-guardrail

on:
  push:
  pull_request:

jobs:
  guardrail:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OBSERVABILITY_EVENTS_FILE: .observability/events.ndjson
      OBSERVABILITY_FORMAT: json
      OBSERVABILITY_LEVEL: info
      OBSERVABILITY_SELF_HEAL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Initialize observability artifact path
        run: |
          set -euo pipefail
          mkdir -p .observability
          rm -f "${OBSERVABILITY_EVENTS_FILE}"

      - name: Run dependency guardrail
        run: npm run guardrail
        env:
          GUARDRAIL_POLICY_FILE: policies/guardrail-policy.json
          GUARDRAIL_RESULT_FILE: guardrail-result.json

      - name: Enforce observability telemetry gate
        if: always()
        run: |
          npm run observability:verify -- \
            --events-file "${OBSERVABILITY_EVENTS_FILE}" \
            --expected-tools guardrail \
            --min-events 2

      - name: Upload guardrail artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-result
          path: guardrail-result.json

      - name: Upload observability events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-events-guardrail
          path: .observability/events.ndjson

      - name: Publish Kafka event on quarantine/block
        if: failure() || cancelled()
        run: npm run publish:guardrail-event
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_TOPIC: security.dependency.events
          GUARDRAIL_RESULT_FILE: guardrail-result.json
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_COMMIT_SHA: ${{ github.sha }}
